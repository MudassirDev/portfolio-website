<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Mudassir</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#C6F135;--glow:rgba(198,241,53,.55);--glow-soft:rgba(198,241,53,.2)}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#EEF1F5;background:#0A0E14}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;
background:radial-gradient(800px 520px at 88% 4%,var(--glow-soft),transparent 65%),radial-gradient(700px 500px at 0% 70%,rgba(61,139,255,.16),transparent 65%),#0A0E14}
.blob{position:absolute;top:160px;right:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,var(--glow-soft),transparent 70%);filter:blur(30px);pointer-events:none;animation:drift 7s ease-in-out infinite alternate}
header{position:relative;z-index:1;border-bottom:1px solid rgba(255,255,255,.06)}
.bar{max-width:1200px;margin:0 auto;padding:14px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;padding:10px 0}
.logo span{color:var(--accent)}
.back{color:#C3CCD8;font-size:15px;padding:12px 0}
main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:64px 32px}
.box{max-width:620px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.code{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:160px;line-height:1;letter-spacing:-.04em;background:linear-gradient(90deg,var(--accent),#7BE0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:44px;line-height:1.1;letter-spacing:-.02em}
p{margin:0;font-size:18px;line-height:1.6;color:#C3CCD8}
.btn{display:inline-block;background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 60%);box-shadow:0 12px 28px -10px var(--glow);color:#0A0E14;font-weight:600;padding:16px 32px;border-radius:999px;font-size:16px;transition:transform .25s ease,filter .25s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
footer{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:32px;color:#9AA7B8;font-size:14px}
.in{opacity:0;animation:fadeUp .8s cubic-bezier(.22,1,.36,1) forwards}
.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.24s}.in:nth-child(4){animation-delay:.36s}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.15)}}
@media (max-width:600px){.code{font-size:110px}h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none}.blob{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="page">
<div class="blob" aria-hidden="true"></div>
<header>
<div class="bar">
<a class="logo" href="/">Mudassir<span>.</span></a>
<a class="back" href="/">Back to home</a>
</div>
</header>
<main>
<div class="box">
<div class="code in">404</div>
<h1 class="in">This page skipped leg day.</h1>
<p class="in">The page you're looking for doesn't exist or has moved. Head back home and pick up where you left off.</p>
<a class="btn in" href="/">Back to home</a>
</div>
</main>
<footer>© Mudassir. Websites for fitness businesses.</footer>
</div>
</body>
</html>
